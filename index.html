<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雲朵記帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC&display=swap">
<style>
:root{color-scheme:light;--bg:#fffdf8;--ink:#86715f;--soft:#bcaea0;--card:#fffefb;--sky1:#eaf4fa;--sky2:#fffdf8;--key:#fffefb;--line:#f3eadb;--accent:#f4a99a;--blue:#b5d6ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Huninn','Noto Sans TC','PingFang TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sky1);z-index:10}
#app{width:100%;max-width:440px;padding:0 14px 24px;background:
radial-gradient(ellipse 70% 40% at 15% 0%,var(--sky1),transparent 70%),
radial-gradient(ellipse 60% 30% at 90% 8%,#fbe6e088,transparent 70%),radial-gradient(ellipse 80% 30% at 10% 100%,#e6f3e488,transparent 70%),var(--bg);transition:background .6s}
body[data-m="warn"] #app{--sky1:#f9e8e8}
body[data-m="rain"] #app{--sky1:#e6e4ec}
.top{display:flex;align-items:center;gap:6px;padding-top:12px}
.cloudbox{position:relative;width:150px;flex:none}
#cloud{width:100%;display:block;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-6px) rotate(1.2deg) scale(1.02,.985)}}
#cloud{transform-origin:50% 90%}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:15px;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.sum{display:flex;gap:10px;margin:6px 0 10px}
.sum div{flex:1;background:var(--card);border-radius:18px;padding:8px 12px;border:2px solid var(--line)}
.sum small{color:var(--soft);font-size:12px}
.sum b{display:block;font-size:20px;font-weight:400}
.amt{text-align:center;font-size:52px;line-height:1.1;padding:4px 0 8px;min-height:64px}
.amt span{font-size:26px;color:var(--soft);margin-right:4px}
.amt.empty b{color:var(--line)}
.amt b{font-weight:400}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.cat{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px 0 6px;font:inherit;color:var(--ink);font-size:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.cat:active{transform:scale(.93)}
.cat svg{display:block;width:54px;height:54px;margin:0 auto 2px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{border:2px solid var(--line);background:var(--key);border-radius:18px;font:inherit;color:var(--ink);font-size:26px;padding:12px 0;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.k:active{transform:translateY(3px);box-shadow:none}
h3{font-weight:400;font-size:15px;color:var(--soft);margin:18px 4px 6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 10px;margin-bottom:6px}
.row{cursor:pointer}.row svg{width:36px;height:36px;flex:none}.pen{color:var(--soft);font-size:14px}.sum div{cursor:pointer}
.hd{display:flex;align-items:center;justify-content:space-between}.tg{border:1.5px solid var(--line);background:var(--card);color:var(--soft);border-radius:12px;font:inherit;font-size:12px;padding:3px 10px;margin-top:12px;cursor:pointer}
.edit{display:flex;align-items:center;gap:6px;background:#fff6e0;border:2px dashed #f3dfb4;border-radius:14px;padding:6px 10px;margin-bottom:6px;font-size:13px}.edit span{flex:1}.edit button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;font:inherit;color:var(--ink);padding:3px 10px;cursor:pointer}.edit[hidden]{display:none}
.row .n{flex:1}.row small{color:var(--soft);display:block;font-size:11px}
.row button{border:0;background:none;color:var(--soft);font-size:20px;padding:4px 8px;cursor:pointer}
.empty-note{color:var(--soft);text-align:center;font-size:14px;padding:8px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rain line{stroke:var(--blue);stroke-width:3;stroke-linecap:round;animation:drop .9s linear infinite;opacity:0}
.rain.on line{opacity:1}
.rain line:nth-child(2){animation-delay:.3s}.rain line:nth-child(3){animation-delay:.6s}
@keyframes drop{from{transform:translateY(-6px)}to{transform:translateY(14px);opacity:0}}
/* 壓克力水彩質感 */
.bubble,.sum div,.cat,.k,.row,.det{background:transparent;border-color:transparent;box-shadow:none;position:relative;isolation:isolate}
.bubble::before,.sum div::before,.cat::before,.k::before,.row::before,.det::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;border:2px solid #ecdcc4;background:radial-gradient(circle at 28% 22%,#fffefb 0,var(--tint,#fff6e6) 100%);box-shadow:0 3px 0 #f1e5d0;filter:url(#rough)}
.k:active::before{box-shadow:none}
.k:nth-child(3n+1){--tint:#ffeede}.k:nth-child(3n+2){--tint:#e8f4ec}.k:nth-child(3n){--tint:#e8f1fa}
.sum div:first-child{--tint:#e6f2fa}.sum div:last-child{--tint:#fdeaea}
.bubble,.det{--tint:#fffaf0}
body[data-m="warn"]{--sky1:#f9e8e8}body[data-m="rain"]{--sky1:#e6e4ec}
.bgart{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;background:none}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 90% 35% at 20% 0%,var(--sky1),transparent 75%);opacity:.8}

.det{min-height:146px;margin:0 0 12px;padding:8px 12px;font-size:14px}
.det .hint{color:var(--soft);text-align:center;padding:54px 0;font-size:13px}
.det .t{color:var(--soft);font-size:12px;margin-bottom:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px}
.chip{flex:none;border:1.5px solid #ecdcc4;background:#fffefb;border-radius:14px;font:inherit;font-size:14px;color:var(--ink);padding:3px 12px;cursor:pointer}
.chip.on{background:#fde6d0;border-color:#f3c9a0}
.det input{width:100%;border:1.5px solid #ecdcc4;border-radius:12px;background:#fffefb;font:inherit;font-size:16px;color:var(--ink);padding:6px 10px;outline:none}
.det input:focus{border-color:#f3c9a0}
.row .n{min-width:0}.row small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font-style:normal;font-size:11px;background:#fdecd8;border-radius:9px;padding:1px 8px;margin-left:6px;color:#b08a68}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{--cl:#8fb3cf;--c1:#f6fbff;--c2:#d3e7f5;--cl2:#bdd9ed;--bl:#f7a9a0}
body[data-m="warn"]{--cl:#e0b49c;--cl2:#f2d6c6;--bl:#f6bfa5}
body[data-m="worry"]{--cl:#d9a99d;--cl2:#efcbc0;--bl:#f3b5a0;--sky1:#f6e3e3}
body[data-m="worry"] #app{--sky1:#f6e3e3}
body[data-m="rain"]{--cl:#8c9ab5;--c1:#eef2f7;--c2:#c9d6e4;--cl2:#bcc6da;--bl:#c6a9c0}
.cloudbox{width:min(195px,50%)}#cloud{overflow:visible;cursor:pointer}
.sbtn.due::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#f4a99a;margin-left:5px;vertical-align:top}
.toprow{text-align:center;color:var(--soft);font-size:14px;margin:-4px 0 12px;line-height:1.6}
.plb{flex:none;align-self:center;font-size:12px;color:var(--soft);margin-right:2px}
.row em.pm{background:#e6eefa;color:#7f9ab8}
.arow{display:flex;align-items:center}.arow .amt{flex:1}
.dbox,.dsp{flex:none;width:80px;display:flex;align-items:center;gap:2px}
.dchip{position:relative;display:inline-block;border:1.5px solid #ecdcc4;background:#fffefb;border-radius:14px;font-size:13px;color:var(--soft);padding:4px 10px;cursor:pointer}
.dchip.on{background:#fde6d0;border-color:#f3c9a0;color:var(--ink)}
.dchip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.dclr{border:0;background:none;color:var(--soft);font-size:18px;padding:0 4px;cursor:pointer}.dclr[hidden]{display:none}
.bk{display:block;width:100%;margin:8px 0;border:2px solid #d7e7f3;background:#e8f1fa;border-radius:16px;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;cursor:pointer}
.sbtn{flex:none;border:2px solid #d7e7f3;background:#e8f1fa;border-radius:18px;font:inherit;color:var(--ink);padding:0 14px;cursor:pointer}
#sheet{position:fixed;inset:0;z-index:20;background:#6b5a4e55;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{width:100%;max-width:560px;height:90%;background:#fffdf8;border-radius:26px 26px 0 0;border:2px solid #ecdcc4;border-bottom:0;display:flex;flex-direction:column;padding:0 14px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px;font-size:18px}
.ph button{border:0;background:none;font-size:30px;color:var(--soft);cursor:pointer}
#sb{overflow-y:auto;flex:1;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.mnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}.mnav .ml{font-size:17px;min-width:120px;text-align:center}
.mb{border:1.5px solid #ecdcc4;background:#fffefb;border-radius:50%;width:34px;height:34px;font:inherit;font-size:20px;color:var(--ink);cursor:pointer}.mb:disabled{opacity:.3}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tab{flex:1;border:1.5px solid #ecdcc4;background:#fffefb;border-radius:14px;font:inherit;color:var(--soft);padding:6px 0;cursor:pointer}.tab.on{background:#e8f1fa;color:var(--ink);border-color:#d0e3f1}
.big{text-align:center;font-size:19px;margin:8px 0 10px}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer}.sr svg{width:32px;height:32px;flex:none}.sn{flex:1}.sl{display:flex;justify-content:space-between;font-size:14px}.sl b{font-weight:400}
.bt{height:10px;background:#f6efe2;border-radius:6px;margin-top:3px;overflow:hidden}.bt i{display:block;height:100%;border-radius:6px}
.dh{color:var(--soft);font-size:13px;margin:12px 4px 5px}
.chip.x{padding:3px 7px;margin-left:-5px;color:var(--soft)}.chip.add{border-style:dashed;color:var(--soft)}.det .ci{width:90px;border-radius:14px;padding:3px 10px;flex:none}
.del.arm{color:#e58a85}.del .ok{font-size:12px;margin-left:2px}
#sb .row::before{filter:none}
</style>

function sameDay(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}

function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function drawPays(r,ch){
  ch.innerHTML='';var cu=PAYC;ch.appendChild(mk('span','plb','付款'));
  PAYS.concat(cu).forEach(function(s){

function drawSheet(){
  var B=$('sb'),n=new Date(),isCur=S.y===n.getFullYear()&&S.m===n.getMonth();B.innerHTML='';

  nav.appendChild(pv);nav.appendChild(lb);nav.appendChild(nx);B.appendChild(nav);
  var tabs=mk('div','tabs');[['stats','統計'],['detail','明細'],['backup','備份']].forEach(function(t){var b=mk('button','tab'+(S.mode===t[0]?' on':''),t[1]);b.onclick=function(){S.mode=t[0];S.cat=null;S.pay=null;drawSheet()};tabs.appendChild(b)});B.appendChild(tabs);

    var mx=Math.max.apply(null,per.concat([1]));
    per.map(function(v,i){return [i,v]}).filter(function(p){return p[1]>0}).sort(function(a,b){return b[1]-a[1]}).forEach(function(p){B.appendChild(statRow(p[0],CATS[p[0]][0]+'　'+Math.round(p[1]/tot*100)+'%',p[1],mx,BAR[p[0]],function(){S.mode='detail';S.cat=p[0];drawSheet()}))});

    if(hasP){B.appendChild(mk('div','dh','付款方式'));var pmx=Math.max.apply(null,Object.keys(pm).map(function(k){return pm[k]}));Object.keys(pm).sort(function(a,b){return pm[b]-pm[a]}).forEach(function(k){B.appendChild(statRow(null,k,pm[k],pmx,'#c5afe3',function(){S.mode='detail';S.cat=null;S.today=false;S.pay=k;drawSheet()}))})}

  if(S.pay)fch('付款：'+S.pay+' ×',true,function(){S.pay=null;drawSheet()});
  fch('全部',S.cat===null&&!S.today&&!S.pay,function(){S.cat=null;S.today=false;S.pay=null;drawSheet()});
  if(isCur)fch('今天',S.today,function(){S.today=true;S.cat=null;drawSheet()});
  CATS.forEach(function(c,i){fch(c[0],S.cat===i,function(){S.cat=i;S.today=false;drawSheet()})});
  B.appendChild(fc);
  var rs=mrs.filter(function(r){return (S.cat===null||r.c===S.cat)&&(!S.today||sameDay(new Date(r.t),n))&&(!S.pay||(r.p||'未標記')===S.pay)}).sort(function(a,b){return b.t-a.t});
  var sum=0;rs.forEach(function(r){sum+=r.a});
  B.appendChild(mk('div','big',rs.length+' 筆，共 '+fmt(sum)));
  if(S.cat!==null&&rs.length){var sb={};rs.forEach(function(r){var k=r.s||'未分細項';sb[k]=(sb[k]||0)+r.a});B.appendChild(mk('div','toprow',Object.keys(sb).sort(function(a,b){return sb[b]-sb[a]}).map(function(k){return k+' '+fmt(sb[k])}).join('　')))}
  if(!rs.length)B.appendChild(mk('div','empty-note','沒有符合的紀錄'));
  var last='';rs.forEach(function(r){var d=new Date(r.t),k=(d.getMonth()+1)+'/'+d.getDate()+' 週'+'日一二三四五六'.charAt(d.getDay());if(k!==last){last=k;B.appendChild(mk('div','dh',k))}B.appendChild(sheetRow(r))});
}
/* 記帳日期（回頭補記、改日期） */
var pickDate=null;
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dlabel(d){return sameDay(d,new Date())?'今天':(d.getMonth()+1)+'/'+d.getDate()}
function recOf(id){return recs.filter(function(x){return x.id===id})[0]}
function atDay(v,base){var p=v.split('-'),b=new Date(base);return new Date(+p[0],+p[1]-1,+p[2],b.getHours(),b.getMinutes(),b.getSeconds()).getTime()}
function recTime(){var n=Date.now();return pickDate==null?n:atDay(ymd(new Date(pickDate)),n)}
function syncChip(){
  var r=editId!==null?recOf(editId):null,d=r?new Date(r.t):(pickDate==null?new Date():new Date(pickDate));
  var off=!sameDay(d,new Date());
  $('dtx').textContent=dlabel(d);$('dchip').className='dchip'+(off?' on':'');
  $('dinp').value=ymd(d);$('dinp').max=ymd(new Date());$('dclr').hidden=!(off&&!r);
}
/* 備份提醒：超過 30 天沒備份就提醒 */
var LBK=0;try{LBK=+localStorage.getItem('cloud-ledger-lastbk')||0}catch(e){}
function bkDue(){if(!recs.length)return false;var b=LBK||Math.min.apply(null,recs.map(function(r){return r.t}));return Date.now()-b>30*864e5}
function markDot(){var e=$('sbtn');if(e)e.className='sbtn'+(bkDue()?' due':'')}
/* 備份與匯入 */
function backupText(){return JSON.stringify({app:'cloud-ledger',v:1,exported:new Date().toISOString(),recs:recs,subs:CUS,pays:PAYC},null,1)}
function exportBackup(say){
  var d=new Date(),name='cloud-ledger-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json',txt=backupText();
  function done(){LBK=Date.now();try{localStorage.setItem('cloud-ledger-lastbk',String(LBK))}catch(e){}markDot();say('已產生備份檔 '+name)}
  function plain(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);done()}catch(e){say('無法下載')}}
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(function(dl){
    if(!dl)return plain();
    dl.save({filename:name,data:txt}).then(done,function(e){say(e&&e.code==='declined'?'已取消':'無法下載')})
  },function(){plain()})}else plain();
}
function importBackup(t,say){
  try{var o=JSON.parse(t);if(!o||o.app!=='cloud-ledger'||!Array.isArray(o.recs))throw 0;
    var ids={},add=0;recs.forEach(function(r){ids[r.id]=1});
    o.recs.forEach(function(r){if(r&&typeof r.id==='number'&&typeof r.a==='number'&&r.c>=0&&r.c<6&&!ids[r.id]){recs.push({id:r.id,a:r.a,c:r.c,t:+r.t||r.id,s:r.s?String(r.s).slice(0,12):null,p:r.p?String(r.p).slice(0,8):null,n:r.n?String(r.n).slice(0,40):''});ids[r.id]=1;add++}});
    recs.sort(function(a,b){return a.t-b.t});
    if(o.subs)for(var k in o.subs){if(+k>=0&&+k<6&&Array.isArray(o.subs[k])){var cur=CUS[k]=CUS[k]||[];o.subs[k].forEach(function(s){s=String(s).slice(0,6);if(s&&cur.indexOf(s)<0&&SUBS[k].indexOf(s)<0)cur.push(s)})}}
    if(Array.isArray(o.pays))o.pays.forEach(function(s){s=String(s).slice(0,6);if(s&&PAYS.concat(PAYC).indexOf(s)<0)PAYC.push(s)});savePay();
    save();saveCus();render();settle();say('匯入完成，新增 '+add+' 筆');
  }catch(e){say('這個檔案看起來不是雲朵記帳的備份')}
}
function drawBackup(B){
  B.removeChild(B.firstChild);
  var n=mk('div','big','目前共 '+recs.length+' 筆紀錄'),msg=mk('div','empty-note','');
  function say(t){msg.textContent=t;n.textContent='目前共 '+recs.length+' 筆紀錄'}
  var b1=mk('button','bk','下載備份檔（JSON）'),b2=mk('button','bk','匯入備份檔'),fi=mk('input');
  fi.type='file';fi.accept='.json,application/json';fi.hidden=true;
  b1.onclick=function(){exportBackup(say)};b2.onclick=function(){fi.click()};
  fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){importBackup(String(rd.result),say)};rd.readAsText(f);fi.value=''};
  B.appendChild(n);B.appendChild(b1);B.appendChild(b2);B.appendChild(fi);
  B.appendChild(mk('div','dh','匯入會把備份裡有、目前沒有的紀錄加進來，不會刪掉現有的。換手機時，先在舊手機下載備份檔，再到新手機匯入。'));
  B.appendChild(msg);
}
/* 細項與備註 */
var SUBS=[['早餐','午餐','晚餐','點心','宵夜','飲品'],['捷運','公車','計程車','火車','加油','停車'],['衣服','鞋包','美妝','3C','禮物'],['電影','遊戲','旅遊','聚會'],['家用','衛生','醫療','水電'],[]];
var detId=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hideDet(){detId=null;$('det').innerHTML='<div class="hint">點分類記帳後，可以在這裡補細項和備註 ☁️</div>'}
function showDet(id){
  var r=recs.filter(function(x){return x.id===id})[0],D=$('det');
  if(!r){hideDet();return}
  detId=id;var subs=SUBS[r.c];
  D.innerHTML='<div class="t">'+CATS[r.c][0]+' '+fmt(r.a)+(r.c===5?'，其他是什麼呢？寫個備註吧':'，以下都可不填')+'</div>'+'<div class="chips"></div><div class="chips pays"></div>'+'<input type="text" maxlength="40" enterkeyhint="done" placeholder="'+(r.c===5?'這筆是買什麼呢？':'備註（可不填）')+'" value="'+esc(r.n||'')+'">';
  var ch=D.querySelector('.chips');
  drawChips(r,ch);drawPays(r,D.querySelector('.pays'));
  D.querySelector('input').oninput=function(){r.n=this.value;save();render()};
}
function banner(){syncChip();
  var e=$('edit'),r=recs.filter(function(x){return x.id===editId})[0];
  if(!r){editId=null;e.hidden=true;return}
  e.hidden=false;e.innerHTML='<span>修改中：'+CATS[r.c][0]+' '+fmt(r.a)+'</span><button id="ec">取消</button><button id="ed">刪除</button>';
  $('ec').onclick=function(){editId=null;fresh=false;buf='';showAmt();banner();hideDet();settle()};
  $('ed').onclick=function(){recs=recs.filter(function(x){return x.id!==editId});editId=null;fresh=false;buf='';save();showAmt();banner();render();hideDet();settle('已經刪掉囉')};
}

/* 數字鍵盤 */
['1','2','3','4','5','6','7','8','9','00','0','⌫'].forEach(function(k){
  var b=document.createElement('button');b.className='k';b.textContent=k;
  b.onclick=function(){
    clearTimeout(baseTimer);
    if(editId===null&&detId!==null)hideDet();
    if(fresh&&k!=='⌫'){buf='';fresh=false}
    if(k==='⌫'){buf=buf.slice(0,-1);fresh=false}
    else if(buf.length+k.length<=7&&!(buf===''&&(k==='0'||k==='00')))buf+=k;
    showAmt();
    if(buf)face('think',buf?null:null);else settle();
  };
  $('keys').appendChild(b);
});

/* 分類 = 點一下就記 */
CATS.forEach(function(c,i){
  var b=document.createElement('button');b.className='cat';
  b.style.setProperty('--tint',c[1]);b.innerHTML=ico(i)+c[0];
  b.onclick=function(){
    clearTimeout(baseTimer);
    if(!buf){face('oops');var a=$('amt');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');baseTimer=setTimeout(settle,1800);return}
    if(editId!==null){recs.forEach(function(r){if(r.id===editId){r.a=Number(buf);if(r.c!==i){r.c=i;r.s=null}}});var eid=editId;editId=null;fresh=false;save();buf='';showAmt();banner();render();face('happy','改好囉');showDet(eid);baseTimer=setTimeout(settle,2000);return}
    calm=false;var nid=Date.now();recs.push({id:nid,a:Number(buf),c:i,t:recTime(),s:null,p:null,n:''});save();
    buf='';showAmt();render();showDet(nid);face('happy',pickDate==null?null:'記好了，記在 '+dlabel(new Date(pickDate)));
    baseTimer=setTimeout(function(){settle()},2000);
  };
  $('cats').appendChild(b);
});

$('tg').onclick=function(){openSheet('detail',{today:true})};$('sbtn').onclick=function(){openSheet('stats')};$('sx').onclick=closeSheet;$('sheet').onclick=function(e){if(e.target===this)closeSheet()};
$('today').parentNode.onclick=function(){openSheet('detail',{today:true})};
$('month').parentNode.onclick=function(){openSheet('detail')};
var TAPS=['wink','star','love','tongue'],tapN=0,tapT=null;
$('cloud').onclick=function(){var was=baseMood();calm=true;var k=TAPS[tapN++%TAPS.length];clearTimeout(tapT);document.body.setAttribute('data-m','good');face(k,was==='good'?null:'好啦，不哭了，你已經很棒了');tapT=setTimeout(function(){settle()},3500)};
$('dinp').onchange=function(){
  var v=this.value;if(!v)return;var r=editId!==null?recOf(editId):null;clearTimeout(baseTimer);
  if(r){r.t=atDay(v,r.t);save();render();banner();face('happy','日期改好了');baseTimer=setTimeout(function(){settle()},2000);return}
  var t=atDay(v,Date.now());pickDate=sameDay(new Date(t),new Date())?null:t;syncChip();
  face('think',pickDate==null?'接下來記在今天':'接下來會記在 '+dlabel(new Date(t)));baseTimer=setTimeout(function(){settle()},2500);
};
$('dclr').onclick=function(){pickDate=null;syncChip();settle('改回今天了')};
hideDet();showAmt();render();syncChip();settle(bkDue()?'已經超過一個月沒備份了，點我到備份頁存一份吧':null);
$('say').onclick=function(){if(bkDue())openSheet('backup')};
</script>
